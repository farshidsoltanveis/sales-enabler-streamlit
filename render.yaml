services:
  - type: web
    name: sales-enabler
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: OPENAI_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: FLASK_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true

